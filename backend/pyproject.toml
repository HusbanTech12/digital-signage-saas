[project]
name = "digital-signage-api"
version = "0.1.0"
description = "Digital Signage SaaS FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=0.21.0",
  "httpx>=0.28.0",
  "PyJWT[crypto]>=2.10.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "websockets>=12.0",
  "greenlet>=3.1.0",
  "psycopg[binary]>=3.2.0",
  "tzdata>=2024.1",
  "certifi>=2024.0.0",
]

# Vercel FastAPI — package entry (backend/app/main.py exports `app`)
[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python -c \"print('backend build ok')\""
